services:
  - type: web
    name: status-so
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
